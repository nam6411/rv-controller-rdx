# rvnode — GPS 시각을 chrony 기준 시계로 (rdx docs/24). deploy.sh가 /etc/chrony/conf.d/에 넣는다.
# gpsd(/dev/ttyS4, NMEA)가 공유 메모리로 시각을 넘긴다. gpsd가 root가 아니라 gpsd 사용자로 돌아 0·1번이 아니라 2번 슬롯.
# PPS 선이 없어 정밀도는 수십~수백 ms다. 인터넷 NTP(pool)가 있으면 그쪽이 뽑히고, LTE가 끊기거나 부팅 직후 망이 없을 때
# GPS가 시계를 잡는다 (Radxa에는 전지 백업 RTC가 없어 오래 꺼져 있으면 시각이 틀어진다). 위성을 잡아야 시각을 낸다.
# offset: NMEA 문장이 실제 초보다 늦게 오는 만큼. NTP와 나란히 돌려 `chronyc sourcestats`로 재서 맞춘다.
refclock SHM 2 refid GPS poll 3 precision 1e-1 offset 0.0 delay 0.2
