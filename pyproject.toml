[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvnode"
version = "0.1.0"
description = "Radxa ZERO 3W node for the RV — BLE devices, GPS, bird-view, broker"
requires-python = ">=3.11"
dependencies = [
    "aiomqtt>=2.3,<3",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
board = ["gpiod>=2.1"]   # Radxa에서만 (libgpiod v2)

[project.scripts]
rvnode = "rvnode.app:cli"

[tool.setuptools.packages.find]
include = ["rvnode*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
