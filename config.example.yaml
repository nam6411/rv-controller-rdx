# rvnode 설정 예시. Radxa에서는 /etc/rvnode.yaml에 둔다 (비밀값이 들어가므로 저장소에 넣지 않는다).

log_level: info            # debug | info | warning | error

node:
  # HA 장치 ID. ESP 9FCEE4(MACH+JBD+TPMS)를 넘겨받으므로 같은 값을 쓴다 — uniq_id가 이어져야 엔티티·기록이 유지된다.
  device_id: 9FCEE4
  # <base>/status (LWT), <base>/sys/info, <base>/sys/cmd
  base: rv/mach
  label: RV node

mqtt:
  host: broker.local       # 1~4단계는 ESP 브로커, 5단계(브로커 전환) 뒤에는 localhost
  port: 1883
  username: ""
  password: ""
  client_id: ""            # 비우면 essio-radxa-<device_id>
  keepalive: 30
  discovery: true
  discovery_prefix: homeassistant

# 외부 브리지 — ls의 mosquitto (mqtt.nam6411.com:8883, TLS). 웹 설정(http://radxa.local/)에서 바꾸면
# /etc/mosquitto/conf.d/rv-bridge.conf를 다시 쓰고 mosquitto를 재시작한다.
bridge:
  enabled: false
  host: mqtt.nam6411.com
  port: 8883
  tls: true
  username: radxa
  password: ""             # 웹에서 넣는다 (저장소에 넣지 않는다)
  remote_prefix: ""

# 웹 설정·상태 페이지
web:
  enabled: true
  port: 80
  password: ""             # 비우면 인증 없음 (차 안 LAN 전용)

# 노드가 이 보드를 브로커로 찾는 길 (docs/29 §3.3, rv-controller docs/15 §5). 브로커를 이 보드로 옮길 때(docs/29 §5 5단계) 켠다:
#   ESP 브로커를 끄고, 위 mqtt.host를 localhost로 바꾼 뒤 enabled: true.
#   - UDP 비콘: 5초마다 "essio-broker <mdns_name> <port>"를 47300으로 브로드캐스트 (공유기가 mDNS를 막아도 노드가 찾는다)
#   - mDNS: 호스트명(radxa.local)은 그대로, avahi로 <mdns_name>.local 별칭 + _mqtt._tcp를 더 알린다
broker:
  enabled: false
  mdns_name: broker        # 노드의 mqtt.mdns_name과 같게
  port: 1883

# 폴백 AP (docs/29 §3.4) — 공유기가 안 보이거나 after_s 넘게 끊기면 이 AP를 띄워 노드를 묶는다.
# AP 중에는 rescan_s마다 공유기를 찾아 보이면 돌아간다. 공유기 SSID·비밀번호는 웹의 Wi-Fi 칸에서 넣는다(NetworkManager에 저장).
# AP 상태에서는 폰을 이 AP에 붙이고 http://192.168.4.1/ 로 들어와 공유기를 고친다.
fallback:
  enabled: false
  iface: wlan0
  ssid: RV-FALLBACK        # 노드의 wifi.fallback_ssid와 같게
  password: ""             # 노드의 wifi.fallback_password와 같게 (8~63자). 웹에서 넣는다
  address: 192.168.4.1/24  # AP 게이트웨이 = 노드가 보는 브로커 주소
  after_s: 60
  rescan_s: 30
  sta_retry_s: 300         # AP 중 스캔을 못 하는 드라이버면 이 주기로 공유기에 그냥 붙어 본다 (0 = 안 함)

# 장치 하나 = ESP의 슬롯 하나. prefix를 비우면 ESP와 같은 규칙:
#   base가 /<slug>로 끝나면 base 그대로, 아니면 <base>/<slug>
devices:
  - type: dummy             # 하드웨어 없이 MQTT·HA 흐름을 확인하는 장치
    slug: demo
    label: Demo
    prefix: rvtest/demo     # 그림자 운용·시험은 rvtest/ 아래에
    discovery: false        # 시험 장치는 HA에 올리지 않는다
    enabled: true
    params:
      interval_s: 5

  # 버드뷰 전원·시점 (rv-controller docs/18 §12.1·§12.2). 칩·라인은 docs/18 §12.1 표 (보드에서 gpioinfo로 한 번 맞춰 본다)
  - type: birdview
    slug: birdview          # → rv/mach/birdview (prefix로 바꿀 수 있다)
    label: Bird view
    enabled: false          # 보드에서 gpioinfo로 라인을 맞춰 본 뒤 켠다
    params:
      backend: gpiod        # Mac 작업대는 fake
      off_delay_s: 30       # 시동을 끈 뒤 더 켜 둘 시간
      blink_hold_s: 1.5     # 깜빡이 마지막 펄스 뒤 그쪽 시점 유지
      pins:
        ign:       { chip: gpiochip1, line: 4, active_low: true, bias: pull-up }     # 핀 37 GPIO1_A4
        left:      { chip: gpiochip3, line: 17, active_low: true, bias: pull-up }    # 핀 22
        right:     { chip: gpiochip4, line: 11, active_low: true }                   # 핀 28 (보드 I2C 풀업이 있다)
        reverse:   { chip: gpiochip3, line: 18, active_low: true, bias: pull-up }    # 핀 32
        power:     { chip: gpiochip3, line: 4 }                                      # 핀 35 GPIO3_A4
        rear:      { chip: gpiochip3, line: 7 }                                      # 핀 36
        left_out:  { chip: gpiochip3, line: 6 }                                      # 핀 38
        right_out: { chip: gpiochip3, line: 5 }                                      # 핀 40

  # GPS(gpsd) + 나침반(QMC5883L) — rv-controller docs/24 §4. gpsd가 /dev/ttyS4를 쥔다 (deploy.sh가 설정)
  - type: gps
    slug: gps               # → <base>/gps
    label: GPS
    enabled: true
    params:
      gpsd: 127.0.0.1:2947
      compass: true
      i2c_bus: 5
      i2c_addr: 0x0D
      declination: -8.5     # 편각(°, 서편 −)
      heading_offset: 265   # 화살표 기준 자북 = 265 − 칩 각도 (docs/24 §7.3)
      cal: { cx: 351, cy: -284, rx: 377, ry: 388 }   # 설치 자리에서 보정 버튼으로 다시 잡는다

  # JBD BMS (BLE FF00) — ESP jbdbms와 같은 키. 실제 카라반 BMS를 넘겨받을 때는 slug: bms, prefix: rv/bms (docs/29 §3.1)
  - type: jbd
    slug: bmstest           # 시험용 4S 파워뱅크 — 실제 9FCEE4_bms_* 엔티티를 덮지 않게 다른 slug
    label: BMS (test)
    discovery: false
    enabled: false
    params:
      ble_address: "A4:C1:37:19:9C:10"
      interval_s: 5

  # Adria MACH-BASIC (BLE NUS, PIN 페어링) — ESP mach와 같은 키. ESP에서 넘겨받으면 slug: mach, prefix: rv/mach
  - type: mach
    slug: mach
    label: MACH
    enabled: false          # 실차에서 켠다. ESP mach 모듈과 동시에 켜지 않는다 (둘 다 9FCEE4_mach_*)
    params:
      name: MACH-BASIC      # address를 비우면 이 이름으로 찾는다
      address: ""
      pin: 123456
      interval_s: 3
      ebl: { enabled: true, lin: 2 }
      alde: { enabled: true, lin: 1 }
      aventa: { enabled: true, lin: 1, model: comfort, on_mode: auto, default_set_c: 22 }
      level: { pitch_axis: z, pitch_sign: -1, roll_axis: y, roll_sign: 1, pitch_offset: 0, roll_offset: 0 }

  # BLE TPMS (수동 스캔, 연결 없음) — ESP tpms와 같은 키. 넘겨받으면 slug: tpms (base가 rv/mach면 rv/mach/tpms)
  - type: tpms
    slug: tpms
    label: TPMS
    enabled: false
    params:
      stale_s: 900          # 이만큼 소식 없으면 그 센서 online=false
      sensors:              # mac을 비워 두면 자리만 — 웹의 '등록 안 된 TPMS'에서 MAC을 골라 넣는다
        - { mac: "80:ea:ca:13:b3:61", name: tow_air, label: Tow Air Suspension, unit: psi }
        - { mac: "81:ea:ca:23:b9:f4", name: caravan_left, label: Caravan Left Tyre, unit: bar }
        - { mac: "82:ea:ca:33:6c:e7", name: caravan_right, label: Caravan Right Tyre, unit: bar }

  # 버드뷰 노브 리모컨 흉내 (CC1101 433.92MHz, SPI3 + CSN 핀 15) — HA 버튼으로 왼쪽·오른쪽·누르기 (rv-controller docs/25 §10)
  - type: bvremote
    slug: bvremote
    label: Bird view remote
    params:
      spi: /dev/spidev3.0
      csn: { chip: gpiochip3, line: 8 }
      tx_dbm: 10

  # UVC 캡처 (버드뷰 영상) — 웹에서 '보기'를 누르는 동안만 장치를 연다. MJPEG를 다시 인코딩하지 않는다 (docs/30)
  - type: video
    slug: video
    label: Bird view video
    discovery: false
    params:
      device: /dev/v4l/by-id/usb-MACROSILICON_AFN_CAP-video-index0
      width: 1280
      height: 720
      fps: 10

  # 아래는 장치 모듈이 생기면 켠다 (docs/29 §5 순서)
  # - type: jbd
  #   slug: bms
  #   prefix: rv/bms
  #   label: BMS
  #   params: { mac: "A5:C2:37:..." }
